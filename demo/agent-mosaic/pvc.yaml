apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agent-mosaic-workspace
  namespace: serverless-harness
  labels:
    app.kubernetes.io/name: agent-mosaic
    app.kubernetes.io/part-of: serverless-harness-demo
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ibm-scale-csi
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: agent-mosaic-storage-viewer
  namespace: serverless-harness
  labels:
    app.kubernetes.io/name: agent-mosaic-storage-viewer
    app.kubernetes.io/part-of: serverless-harness-demo
spec:
  restartPolicy: Always
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: viewer
      image: busybox:1.36
      command: ["sh", "-c", "trap : TERM INT; sleep infinity & wait"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        readOnlyRootFilesystem: true
      volumeMounts:
        - name: workspace
          mountPath: /workspace
          readOnly: true
  volumes:
    - name: workspace
      persistentVolumeClaim:
        claimName: agent-mosaic-workspace
        readOnly: true
