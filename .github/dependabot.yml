version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # All codeql-action sub-actions (init, analyze, upload-sarif) must be
      # bumped together — they fail CI if versions diverge across steps.
      codeql-action:
        patterns:
          - 'github/codeql-action*'

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  # Go modules were not covered above, so Go advisories reached us only as a red
  # trivy-scan gate and had to be bumped by hand -- CVE-2026-84304 (grpc) in #203.
  #
  # `directories` is a shorthand for the two go.mod files, NOT a way to bundle them:
  # Dependabot still opens one PR per directory. Bundling would need
  # `group-by: dependency-name`, which is version-updates-only and splits one PR per
  # dependency -- so it would leave security bumps, the reason this entry exists,
  # unbundled. The root go.work is what keeps those per-directory PRs green; see #212.
  - package-ecosystem: gomod
    directories:
      - /gen/go
      - /remote-worker
    schedule:
      interval: weekly
    groups:
      # grpc, protobuf and genproto are generated-code peers: bumping one without
      # the others can break the buf-generated bindings, so move them together.
      grpc-protobuf:
        patterns:
          - 'google.golang.org/grpc*'
          - 'google.golang.org/protobuf*'
          - 'google.golang.org/genproto*'
    ignore:
      # grpc-go 1.84.0 is a regression, not an upgrade. The fix for CVE-2026-84445 (server
      # panic on RPCs missing :authority and Host) shipped on the 1.83 maintenance branch as
      # 1.83.2, but 1.84.0 was cut without it. Go's advisory ranges read
      # `introduced 1.84.0-dev -> fixed 1.85.0-dev.0.20260825072537`, so 1.84.0 sits inside an
      # unfixed window and trivy-scan correctly rejected the bump in #322. 1.83.2, which we
      # already pin, is the only safe released version -- there is no 1.84.1, and the
      # `v1.85.0-dev` tag sorts below the fixed pseudo-version. Drop this once 1.85.0 ships.
      #
      # Scoped to the exact version so a genuinely fixed 1.85.0 still arrives normally.
      - dependency-name: 'google.golang.org/grpc'
        versions:
          - '1.84.0'
